<!DOCTYPE html>
<html lang="en">

    <head>
        <title>forms</title>
        <link rel="stylesheet" href="sign-up.css">
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    </head>

    <body>
        <h1>Sign Up Form</h1>
        <input class="name" type="text" placeholder="First Name">
        <input class="name" type="text" placeholder="Last Name">
        <input class="email" type="email" placeholder="Email">
        <button class="sign-up-button">Sign Up</button>

        <h1>Uber Request Form</h1>

        <p><span class="form-title">Request a ride now</span></p>
        <input class="uber-details" type="text" placeholder="Pickup Location">
        <input class="uber-details" type="text" placeholder="Destination">
        <button class="request-now">Request Now</button>
        <button class="schedule-later">Schedule for Later</button>
    </body>

</html>
