<html>

    <head>
        <style>
            .search-box {
                width: 400px;
                height: 40px;
                padding: 18px;
                font-size: 16px;
                border: 1px solid #aaa;
                border-radius: 20px;
                box-shadow: 1px 2px 3px rgba(0, 0, 0, 0.2);
                color: #555;
            }

            .profile-picture {
                width: 50px;
                height: 50px;
                border-radius: 50%;
                margin-left: 20px;
                vertical-align: middle;
            }

            .text-box {
                width: 250px;
                height: 40px;
                padding: 10px;
                font-size: 16px;
                border: none;
                vertical-align: middle;
                color: #555;
            }

            .tweet-button {
                background-color: #1da1f2;
                color: #fff;
                border: none;
                padding: 10px 20px;
                font-size: 16px;
                border-radius: 20px;
                cursor: pointer;
                vertical-align: middle;
                transition: background-color 0.3s ease;
            }

            .tweet-button:hover {
                background-color: #0d8ddb;
            }

            .tweet-button:active {
                background-color: #0a6ca8;
            }
        </style>
    </head>


    <body>
        <input type="text" class="search-box" placeholder="Search Google or type a URL">

        <img class="profile-picture" src="cat.jpg">
        <input type="text" class="text-box" placeholder="What's happening?">
        <button class="tweet-button">Tweet</button>
    </body>

</html>
